<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huruf</title>
<link rel="stylesheet" href="style.css">
<style>
body { padding-top: 20px; padding-bottom: 60px; text-align: center; }
.word-hint  { font-size: 20px; color: #666; margin-top: 6px; }
.emoji-hint { font-size: 56px; margin: 6px 0; }
.prompt-text { font-size: 20px; font-weight: 600; color: #555; margin: 10px 0 14px; }
</style>
</head>
<body>

<h2 class="page-title">🔤 Huruf</h2>

  <button class="mode-btn" onclick="setMode(2, this)">Huruf Pertama</button>

<div class="question-card" id="questionCard"></div>

<div class="choice-grid" id="choiceGrid"></div>

<div class="subject-feedback" id="feedback" style="display:none;"></div>
<button class="next-btn" id="btnNext" onclick="nextQuestion()" style="display:none;">➡️ Seterusnya</button>

<a href="index.html" class="back-link">🏠 Menu Utama</a>
