<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik Tambah</title>
<link rel="stylesheet" href="style.css">
<style>
body { padding-top: 20px; padding-bottom: 60px; text-align: center; }
.math-equation { font-size: 54px; font-weight: 700; color: #ff6600; margin-bottom: 10px; letter-spacing: 2px; }
.stars-display { display: flex; justify-content: center; align-items: flex-start; gap: 16px; min-height: 32px; }
.stars-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 120px; }
.math-star {
  display: inline-block; font-size: 20px; opacity: 0;
  animation: emoji-pop 0.3s ease forwards; margin: 1px;
}
</style>
</head>
<body>

<h2 class="page-title">➕ Matematik Tambah</h2>
<div class="hud-bar" id="hud"></div>

<div class="question-card">
  <div class="math-equation" id="equation"></div>
  <div class="stars-display">
    <div class="stars-row" id="starsA"></div>
    <div style="font-size:20px;color:#bbb;padding-top:2px;">+</div>
    <div class="stars-row" id="starsB"></div>
  </div>
</div>

<div class="choice-grid" id="choiceGrid"></div>

<div class="subject-feedback" id="feedback" style="display:none;"></div>
<button class="next-btn" id="btnNext" onclick="nextQuestion()" style="display:none;">➡️ Seterusnya</button>

<a href="subtraction.html" style="display:inline-block;margin-top:10px;font-size:17px;background:#FF8E53;color:#fff;padding:10px 22px;border-radius:12px;text-decoration:none;box-shadow:0 3px 6px rgba(0,0,0,0.15);">➖ Cuba Tolak!</a>

<a href="index.html" class="back-link">🏠 Menu Utama</a>

<script src="sounds.js"></script>
<script src="mascot.js"></script>
<script src="add_script.js"></script>
</body>
</html>
