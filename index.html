<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Bersama!</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  padding-top: 40px;
  padding-bottom: 60px;
  text-align: center;
}
.app-title {
  font-size: 34px;
  font-weight: 700;
  color: #ff6600;
  margin-bottom: 6px;
}
.app-subtitle {
  font-size: 18px;
  color: #888;
  margin-bottom: 28px;
}
</style>
</head>
<body>

<div class="app-title">🌟 Belajar Bersama!</div>
<div class="app-subtitle">Pilih subjek untuk belajar</div>

<div class="subject-grid">
  <a class="subject-card card-math" href="addition.html">
    <span class="card-icon">🔢</span>
    <span class="card-label">Matematik</span>
    <span class="card-sub">Tambah &amp; Tolak</span>
  </a>
  <a class="subject-card card-letters" href="letters.html">
    <span class="card-icon">🔤</span>
    <span class="card-label">Huruf</span>
    <span class="card-sub">A hingga Z</span>
  </a>
  <a class="subject-card card-counting" href="counting.html">
    <span class="card-icon">⭐</span>
    <span class="card-label">Mengira</span>
    <span class="card-sub">1 hingga 10</span>
  </a>
  <a class="subject-card card-shapes" href="shapes.html">
    <span class="card-icon">🔷</span>
    <span class="card-label">Bentuk &amp; Warna</span>
    <span class="card-sub">Bulatan, Segi...</span>
  </a>
  <a class="subject-card card-animals" href="animals.html">
    <span class="card-icon">🐘</span>
    <span class="card-label">Haiwan</span>
    <span class="card-sub">Binatang &amp; Nama</span>
  </a>
</div>

<script src="sounds.js"></script>
<script src="mascot.js"></script>
<script>
  document.querySelectorAll('.subject-card').forEach(function (card) {
    card.addEventListener('click', function () {
      if (window.SoundFX) SoundFX.click();
    });
  });
</script>
</body>
</html>
