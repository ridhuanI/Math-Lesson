<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Jenis Quiz</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            padding-top: 60px;
            padding-bottom: 40px;
            text-align: center;
        }

        h1 {
            color: #ff6600;
            margin-bottom: 20px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        button {
            display: inline-block;
            font-size: 22px;
            background: #ffd966;
            color: #333;
            padding: 13px 36px;
            border-radius: 12px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: transform 0.15s, background 0.3s;
            border: none;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
            background: #ffeb99;
        }

        a.back-link {
            font-size: 20px;
            color: #444;
            text-decoration: none;
            padding: 10px 0;
            display: inline-block;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        a.back-link:hover {
            opacity: 0.7;
        }

    </style>
</head>

<body>

<h1>Pilih Jenis Quiz</h1>

<div class="menu-container">

    <div class="section-heading" style="margin:4px 0;">📐 Matematik</div>
    <button onclick="location.href='quiz_select.html?op=tambah'">➕ Matematik Tambah</button>
    <button onclick="location.href='quiz_select.html?op=tolak'">➖ Matematik Tolak</button>
    <button onclick="location.href='quiz_select.html?op=mengira'">⭐ Mengira 1-10</button>
    <button onclick="location.href='quiz_select.html?op=bentuk'">🔷 Bentuk &amp; Warna</button>
    <button onclick="location.href='quiz_select.html?op=padanan'">🎯 Padankan Bentuk</button>

    <div class="section-heading" style="margin:14px 0 4px;">📖 Bahasa Melayu</div>
    <button onclick="location.href='quiz_select.html?op=huruf'">🔤 Huruf A-Z</button>
    <button onclick="location.href='quiz_select.html?op=sukukata'">🔡 Suku Kata BM</button>
    <button onclick="location.href='quiz_select.html?op=warna'">🎨 Warna</button>

    <div class="section-heading" style="margin:14px 0 4px;">🇬🇧 English</div>
    <button onclick="location.href='quiz_select.html?op=english'">🇬🇧 English</button>

    <div class="section-heading" style="margin:14px 0 4px;">🔬 Sains</div>
    <button onclick="location.href='quiz_select.html?op=haiwan'">🐘 Haiwan</button>
    <button onclick="location.href='quiz_select.html?op=sains'">🔬 Sains</button>

    <a href="index.html" class="back-link" style="margin-top:16px;">🏠 Kembali ke Menu Utama</a>
</div>

</body>
</html>
